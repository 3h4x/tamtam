name: Release

on:
  push:
    branches:
      - master

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Zero-dependency replacement for semantic-release; reads .releaserc as is.
      # No Node setup or pnpm install: the action needs neither.
      - name: Release
        id: release
        uses: 3h4x/gha-semantic-tag-vanilla@79cc48684d2cacae369a4aace599b84bbf400984 # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
