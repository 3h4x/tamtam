tools:
  - name: tamtam_health
    description: Check TamTam health
    url: http://127.0.0.1:1337/api/health
    response:
      type: json

  - name: tamtam_project_recommendations
    description: Fetch recommendations for a TamTam project
    url: http://127.0.0.1:1337/api/projects/by-project/{project}/recommendations
    params:
      - name: project
        description: TamTam project name
        required: true
    response:
      type: json

  - name: tamtam_project_branch
    description: Fetch current branch state for a TamTam project
    url: http://127.0.0.1:1337/api/projects/by-project/{project}/branch
    params:
      - name: project
        description: TamTam project name
        required: true
    response:
      type: json

  - name: tamtam_project_changes
    description: Fetch uncommitted change summary for a TamTam project
    url: http://127.0.0.1:1337/api/projects/by-project/{project}/changes
    params:
      - name: project
        description: TamTam project name
        required: true
    response:
      type: json

  - name: tamtam_job
    description: Fetch a TamTam job record
    url: http://127.0.0.1:1337/api/jobs/{jobId}
    params:
      - name: jobId
        description: TamTam job ID
        required: true
    response:
      type: json

  - name: tamtam_job_logs
    description: Fetch TamTam job logs
    url: http://127.0.0.1:1337/api/jobs/{jobId}/logs
    params:
      - name: jobId
        description: TamTam job ID
        required: true
    response:
      type: json

  - name: tamtam_usage_quota
    description: Fetch TamTam provider quota
    url: http://127.0.0.1:1337/api/usage/quota
    params:
      - name: provider
        description: Optional provider name, such as claude or codex
    response:
      type: json
