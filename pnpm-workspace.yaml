# Minimum age (in minutes) before a newly published package version is
# installable. Defends against supply-chain attacks where a malicious
# version gets published and consumed within minutes. Override per-package
# with `minimumReleaseAgeExclude` if you need a same-day security patch.
minimumReleaseAge: 10080 # minutes (7 × 24 × 60)
minimumReleaseAgeExclude:
  - devalue

overrides:
  '@esbuild-kit/core-utils>esbuild': 0.28.1
  '@workflow/world-local>undici': 7.28.0
  '@workflow/world-vercel>undici': 7.28.0
  dompurify: 3.4.10
  js-yaml: 4.2.0
  'next>postcss': 8.5.15
  vite: 8.0.16

allowBuilds:
  '@nestjs/core': false
  '@swc/core': false
  better-sqlite3: false
  cbor-extract: false
  esbuild: true
  puppeteer: false
  sharp: true
  unrs-resolver: true
