<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Accent</title>
<style>
  body { margin: 0; padding: 16px; background: #fff; font: 13px -apple-system, system-ui, sans-serif; color: #1a1a1a; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .panel { border: 1px solid #e5e5e5; border-radius: 8px; padding: 12px; }
  .panel.dark { background: #0f0f0f; border-color: #2a2a2a; color: #e5e5e5; }
  .panel.dark .meta { color: #666; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: #999; margin: 0 0 10px; font-weight: 500; }
  .panel.dark h2 { color: #666; }
  .ch-row { display: flex; gap: 8px; align-items: stretch; }
  .ch { flex: 1; border-radius: 6px; padding: 10px 8px; font-size: 11px; font-weight: 500; }
  .meta { font: 11px ui-monospace, Menlo, monospace; color: #999; font-variant-numeric: tabular-nums; margin-top: 4px; }
  .hint { font-size: 11px; color: #999; margin-top: 10px; }
  .panel.dark .hint { color: #666; }
</style>
</head>
<body>
<div class="row">
  <div class="panel">
    <h2>Light — accent</h2>
    <div class="ch-row">
      <div class="ch" style="background:#2563eb;color:#fff;">accent</div>
      <div class="ch" style="background:#1d4ed8;color:#fff;">accent-hover</div>
      <div class="ch" style="background:rgba(37,99,235,.10);color:#2563eb;border:1px solid rgba(37,99,235,.30)">accent-light</div>
    </div>
    <div class="meta">#2563EB · #1D4ED8 · 10% / 30% α</div>
    <div class="hint">Selected nav, primary buttons, focus rings, links.</div>
  </div>
  <div class="panel dark">
    <h2>Dark — accent</h2>
    <div class="ch-row">
      <div class="ch" style="background:#3b82f6;color:#fff;">accent</div>
      <div class="ch" style="background:#2563eb;color:#fff;">accent-hover</div>
      <div class="ch" style="background:rgba(59,130,246,.10);color:#3b82f6;border:1px solid rgba(59,130,246,.30)">accent-light</div>
    </div>
    <div class="meta">#3B82F6 · #2563EB · 10% / 30% α</div>
    <div class="hint">Same role, brighter base for dark surface.</div>
  </div>
</div>
</body>
</html>
