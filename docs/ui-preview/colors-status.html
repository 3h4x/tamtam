<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Status</title>
<style>
  body { margin: 0; padding: 16px; background: #fff; font: 13px -apple-system, system-ui, sans-serif; color: #1a1a1a; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .card { border: 1px solid #e5e5e5; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  .dot { width: 14px; height: 14px; }
  .name { font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
  .hex { font: 11px ui-monospace, Menlo, monospace; color: #999; font-variant-numeric: tabular-nums; }
  .pill { font-size: 11px; padding: 2px 6px; border-radius: 4px; font-weight: 500; }
  .use { font-size: 11px; color: #666; line-height: 1.4; }
</style>
</head>
<body>
<div class="grid">
  <div class="card">
    <div class="name"><svg class="dot" viewBox="0 0 14 14" fill="none" stroke="#22c55e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="7" r="5.5"/><path d="M4.5 7l1.8 1.8 3-3.5"/></svg>success</div>
    <div class="hex">#22C55E</div>
    <span class="pill" style="background:rgba(34,197,94,.10);color:#22c55e">lgtm</span>
    <div class="use">CI passed, verdict LGTM, idle dot.</div>
  </div>
  <div class="card">
    <div class="name"><svg class="dot" viewBox="0 0 14 14" fill="none" stroke="#ef4444" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="7" r="5.5"/><path d="M5 5l4 4M9 5l-4 4"/></svg>error</div>
    <div class="hex">#EF4444</div>
    <span class="pill" style="background:rgba(239,68,68,.10);color:#ef4444">do not ship</span>
    <div class="use">CI failed, run failed, error banner.</div>
  </div>
  <div class="card">
    <div class="name"><svg class="dot" viewBox="0 0 14 14" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 1.5L12.5 12H1.5L7 1.5z"/><path d="M7 5.5v3M7 10v.5"/></svg>warning</div>
    <div class="hex">#F59E0B</div>
    <span class="pill" style="background:rgba(245,158,11,.10);color:#f59e0b">needs attention</span>
    <div class="use">Stale, paused, unreviewed changes.</div>
  </div>
  <div class="card">
    <div class="name"><svg class="dot" viewBox="0 0 14 14" fill="none" stroke="#3b82f6" stroke-width="1.8" stroke-linecap="round"><path d="M7 1.5a5.5 5.5 0 1 1-3.889 1.611"/></svg>info</div>
    <div class="hex">#3B82F6</div>
    <span class="pill" style="background:rgba(59,130,246,.10);color:#3b82f6">running</span>
    <div class="use">In progress, info messaging.</div>
  </div>
</div>
</body>
</html>
