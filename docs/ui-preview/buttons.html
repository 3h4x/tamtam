<!doctype html>
<html><head><meta charset="utf-8"><title>Buttons</title>
<style>
  body { margin:0; padding:16px; background:#fff; font:13px -apple-system,system-ui,sans-serif; color:#1a1a1a; }
  .label { font:500 11px ui-monospace,Menlo,monospace; color:#999; text-transform:uppercase; letter-spacing:0.06em; margin:0 0 8px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  .btn {
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding:0 14px; height:34px;
    font:500 14px -apple-system,system-ui,sans-serif; line-height:1;
    border-radius:8px; border:1px solid transparent; cursor:pointer; box-sizing:border-box;
  }
  .btn-sm {
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding:0 10px; height:26px;
    font:500 12px -apple-system,system-ui,sans-serif; line-height:1;
    border-radius:6px; border:1px solid transparent; cursor:pointer; box-sizing:border-box;
  }
  .primary { background:#2563eb; color:#fff; }
  .primary-hover { background:#1d4ed8; color:#fff; }
  .success { background:#22c55e; color:#fff; }
  .secondary { background:#f5f5f5; border-color:#e5e5e5; color:#1a1a1a; }
  .danger-outline { background:transparent; border-color:rgba(239,68,68,.30); color:#ef4444; }
  .disabled { background:#2563eb; color:#fff; opacity:.5; cursor:not-allowed; }
</style></head><body>

<div class="label">Primary — md (h 34, 14/500, radius 8)</div>
<div class="row">
  <button class="btn primary">Save Settings</button>
  <button class="btn primary-hover">Save Settings</button>
  <button class="btn success">Saved!</button>
  <button class="btn disabled" disabled>Saving…</button>
  <button class="btn primary"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 1.5l4 4-1.5 4-2.5 2.5L4.5 9.5 3 7l2.5-2.5z"/><circle cx="8" cy="5" r="1"/><path d="M4.5 9.5L3 12"/></svg>Release</button>
</div>

<div class="label">Secondary — md</div>
<div class="row">
  <button class="btn secondary">Cancel</button>
  <button class="btn secondary">Send Test</button>
  <button class="btn secondary">Create Backup</button>
  <button class="btn danger-outline">Delete</button>
</div>

<div class="label">Small — sm (h 26, 12/500, radius 6)</div>
<div class="row">
  <button class="btn-sm primary"><svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 1.5l4 4-1.5 4-2.5 2.5L4.5 9.5 3 7l2.5-2.5z"/><circle cx="8" cy="5" r="1"/><path d="M4.5 9.5L3 12"/></svg>Release</button>
  <button class="btn-sm secondary">review</button>
  <button class="btn-sm secondary">All</button>
  <button class="btn-sm secondary">Logs</button>
  <button class="btn-sm danger-outline">Delete</button>
</div>

</body></html>
