<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing</title>
<style>
  body { margin:0; padding:16px; background:#fff; font:13px -apple-system,system-ui,sans-serif; color:#1a1a1a; }
  .row { display:flex; gap:8px; align-items:flex-end; margin-bottom:14px; }
  .bar { background:#2563eb; border-radius:3px; }
  .b { display:flex; flex-direction:column; align-items:center; gap:4px; font:11px ui-monospace,Menlo,monospace; color:#999; font-variant-numeric:tabular-nums; }
  .label { font:500 11px ui-monospace,Menlo,monospace; color:#999; text-transform:uppercase; letter-spacing:0.06em; margin:0 0 8px; }
  .radii { display:flex; gap:10px; align-items:center; }
  .r { background:#f5f5f5; border:1px solid #e5e5e5; padding:14px 16px; font-weight:500; font-size:12px; color:#666; }
</style></head><body>
<div class="label">Spacing scale (Tailwind 4)</div>
<div class="row">
  <div class="b"><div class="bar" style="width:24px;height:4px"></div>1 · 4</div>
  <div class="b"><div class="bar" style="width:24px;height:8px"></div>2 · 8</div>
  <div class="b"><div class="bar" style="width:24px;height:12px"></div>3 · 12</div>
  <div class="b"><div class="bar" style="width:24px;height:16px"></div>4 · 16</div>
  <div class="b"><div class="bar" style="width:24px;height:20px"></div>5 · 20</div>
  <div class="b"><div class="bar" style="width:24px;height:24px"></div>6 · 24</div>
  <div class="b"><div class="bar" style="width:24px;height:32px"></div>8 · 32</div>
</div>
<div class="label">Radii</div>
<div class="radii">
  <div class="r" style="border-radius:6px">sm · 6</div>
  <div class="r" style="border-radius:8px">md · 8</div>
  <div class="r" style="border-radius:12px">lg · 12</div>
  <div class="r" style="border-radius:9999px">pill</div>
</div>
</body></html>
