<!doctype html>
<html><head><meta charset="utf-8"><title>Inputs</title>
<style>
  body { margin:0; padding:16px; background:#fff; font:13px -apple-system,system-ui,sans-serif; color:#1a1a1a; }
  .row { margin-bottom:10px; }
  label { display:block; font-size:13px; font-weight:500; margin-bottom:6px; }
  .help { font-size:12px; color:#999; margin-top:6px; }
  .input { width:100%; padding:8px 12px; background:#fff; border:1px solid #e5e5e5; border-radius:8px; font:13px ui-monospace,Menlo,monospace; color:#1a1a1a; box-sizing:border-box; }
  .input:focus { outline:none; border-color:#2563eb; box-shadow:0 0 0 3px rgba(37,99,235,.30); }
  .input.focus { border-color:#2563eb; box-shadow:0 0 0 3px rgba(37,99,235,.30); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
</style></head><body>
<div class="grid">
  <div class="row">
    <label>Workspace Path</label>
    <input class="input" value="/Users/me/code">
    <div class="help">Root directory containing your git projects</div>
  </div>
  <div class="row">
    <label>GitHub Owner</label>
    <input class="input focus" value="3h4x" placeholder="org or user">
    <div class="help">Default GitHub org/user</div>
  </div>
</div>
</body></html>
